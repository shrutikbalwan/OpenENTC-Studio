name: Numerical error
description: Report an incorrect engineering or numerical result
title: "[Numerical]: "
labels: ["numerical-correctness"]
body:
  - type: textarea
    id: calculation
    attributes:
      label: Calculation and inputs
      description: Include units, conventions, model assumptions, and the smallest reproducible input.
    validations:
      required: true
  - type: textarea
    id: values
    attributes:
      label: Expected and observed values
      description: Include absolute/relative tolerance and enough significant digits to reproduce the discrepancy.
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: Reference method
      description: Analytic derivation, standard, paper, or independently verified tool and exact version.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpenENTC and engine versions
    validations:
      required: true
  - type: textarea
    id: determinism
    attributes:
      label: Reproducibility details
      description: Seed, platform, repeated-run behavior, warnings, and relevant dependency versions.
