name: OpenENTC verification

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes an older run.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run complete verification
        run: npm run verify

  browser-e2e:
    name: Browser journeys (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright-core install --with-deps chromium
      - name: Run browser journeys
        run: npm run test:e2e
      - name: Upload failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-failure-traces
          path: test-results/e2e/
          if-no-files-found: ignore
          retention-days: 14

  coverage:
    name: Coverage and mutation checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Full history so the thresholds can be compared with the main branch.
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build the browser app (some tests inspect dist/)
        run: npm run build
      - name: Check coverage thresholds (never lower than main)
        run: node scripts/coverage.mjs --compare-base origin/main
      - name: Check that tests kill targeted mutants
        run: npm run test:mutation
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  security-audit:
    name: Dependency audit (npm and Cargo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Audit npm dependencies (workspace)
        run: npm audit --audit-level=low
      - name: Audit npm dependencies (desktop shell)
        working-directory: apps/desktop
        run: npm audit --audit-level=low
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
      - name: Install cargo-audit (pinned)
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Cargo dependencies
        working-directory: apps/desktop/src-tauri
        run: cargo audit

  desktop-linux-build:
    name: Linux desktop build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check Rust formatting
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check
      - name: Install workspace dependencies
        run: |
          npm ci
          npm --prefix apps/desktop ci
      - name: Run Rust unit tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --lib
      - name: Build Linux desktop packages
        env:
          RUSTFLAGS: -A dead_code
        run: npm --prefix apps/desktop run build:linux-bundles
      - name: Inspect Linux package payloads
        shell: bash
        run: |
          deb="apps/desktop/src-tauri/target/release/bundle/deb/OpenENTC Studio_0.1.0_amd64.deb"
          appimage="apps/desktop/src-tauri/target/release/bundle/appimage/OpenENTC Studio_0.1.0_amd64.AppImage"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | grep -E 'usr/bin/openentc-studio|usr/share/applications|usr/share/icons'
          file "$appimage" | grep -E 'ELF 64-bit|x86-64'
          extract_dir="$(mktemp -d)"
          (
            cd "$extract_dir"
            "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null
            test -x squashfs-root/usr/bin/openentc-studio
          )
          rm -rf "$extract_dir"
      - name: Upload Linux desktop packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openentc-studio-linux-packages
          path: |
            apps/desktop/src-tauri/target/release/openentc-studio
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
