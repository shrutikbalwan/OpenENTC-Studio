# Dependabot opens pull requests for outdated or vulnerable dependencies. Every update still
# goes through the normal review and CI; new dependencies need the review in CONTRIBUTING.md.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      dev-tooling: { patterns: ['*'], update-types: [minor, patch] }
    ignore:
      # TypeScript 7 is the native (Go) compiler and has no JavaScript compiler API yet; lint,
      # typecheck, ui:check and the refactoring tools call that API. Revisit when it does.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      desktop-npm: { patterns: ['*'], update-types: [minor, patch] }
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      desktop-cargo: { patterns: ['*'], update-types: [patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
